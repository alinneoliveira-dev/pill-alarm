{% extends "base.html" %}

{% block title %}Nova medicação | Pill Alarm{% endblock %}

{% block content %}

<section class="form-page container">

    <div class="form-header">
        <a href="/dashboard" class="back-link">
            ← Voltar
        </a>

        <span class="eyebrow">NOVA MEDICAÇÃO</span>

        <h1>Adicionar medicação</h1>
        <p>Cadastre a medicação e defina quando ela deve ser tomada.</p>
    </div>


    <form id="medication-form" class="medication-form">

        <div class="form-group">
            <label for="name">Nome da medicação</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Ex.: Paracetamol"
                required
            >
        </div>


        <div class="form-group">
            <label for="dosage">Dosagem</label>

            <input
                type="text"
                id="dosage"
                name="dosage"
                placeholder="Ex.: 500mg"
            >
        </div>


        <div class="form-group">
            <label for="instructions">Instruções</label>

            <textarea
                id="instructions"
                name="instructions"
                placeholder="Ex.: Após as refeições"
                rows="4"
            ></textarea>
        </div>


        <div class="form-group">
            <label for="time">Horário</label>

            <input
                type="time"
                id="time"
                name="time"
                required
            >
        </div>


        <div id="form-message" class="form-message"></div>


        <div class="form-actions">

            <a href="/dashboard" class="cancel-button">
                Cancelar
            </a>

            <button type="submit" class="save-button">
                Salvar medicação
            </button>

        </div>

    </form>

</section>

{% endblock %}
